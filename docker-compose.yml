name: rt0705-presentation

services:
  presentation:
    build: .
    image: rt0705-presentation
    restart: unless-stopped
    environment:
      API_URL: ${API_URL}
      SECRET_KEY: ${SECRET_KEY}
    volumes:
      - .:/app
    networks:
      - presentation-net
    ports:
      - "5000:5000"

networks:
  presentation-net:
    name: rt0705-presentation-net
    external: true