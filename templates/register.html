{% extends "base.html" %}
{% block title %}Inscription{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Créer un compte</h1>

  {% if errors %}
  <div class="errors">
    <ul>
      {% for error in errors %}<li>{{ error }}</li>{% endfor %}
    </ul>
  </div>
  {% endif %}

  <form method="post" action="{{ url_for('register') }}">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ form.email or '' }}"
             maxlength="254" autocomplete="email" required autofocus>
    </div>

    <div class="field">
      <label for="username">Nom d'utilisateur</label>
      <input type="text" id="username" name="username" value="{{ form.username or '' }}"
             minlength="3" maxlength="30" autocomplete="username" required>
      <p class="hint">Entre 3 et 30 caractères.</p>
    </div>

    <div class="field">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" name="password"
             minlength="8" maxlength="128" autocomplete="new-password" required>
      <p class="hint">Au moins 8 caractères.</p>
    </div>

    <div class="field">
      <label for="password_confirm">Confirmation du mot de passe</label>
      <input type="password" id="password_confirm" name="password_confirm"
             minlength="8" maxlength="128" autocomplete="new-password" required>
    </div>

    <div class="actions">
      <button type="submit">Créer mon compte</button>
    </div>
  </form>

  <p class="muted">Déjà inscrit ? <a href="{{ url_for('login') }}">Se connecter</a></p>
</section>
{% endblock %}
