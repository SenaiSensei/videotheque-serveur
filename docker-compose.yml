services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
    networks:
      - data-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    image: rt0705-api
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/videotheque?authSource=admin
      SEED_FILE: /app/data/videotheque.json
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ../API:/app
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - data-net
      - presentation-net
    ports:
      - "127.0.0.1:5001:5000"

